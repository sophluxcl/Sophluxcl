<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f3ec">

  <title>SOPHLUX · Colección Hogar</title>

  <style>
    :root {
      --background: #f7f3ec;
      --background-light: #fcfaf6;
      --card: rgba(255, 255, 255, 0.76);

      --text: #292724;
      --muted: #777168;

      --gold: #b68a47;
      --gold-soft: #d8c29c;

      --line: rgba(62, 56, 48, 0.12);

      --shadow:
        0 18px 50px rgba(70, 60, 47, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;

      padding:
        max(28px, env(safe-area-inset-top))
        22px
        max(28px, env(safe-area-inset-bottom));

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--text);

      font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255, 255, 255, 0.95),
          transparent 46%
        ),
        linear-gradient(
          180deg,
          #fcfaf6 0%,
          #f3ede4 100%
        );
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    /* =========================
       LOGO OFICIAL SOPHLUX
       ========================= */

    .brand {
      margin-bottom: 34px;
      text-align: center;
    }

    .brand-logo {
      display: block;

      width: min(100%, 330px);
      height: auto;

      margin: 0 auto;

      object-fit: contain;
    }

    /* =========================
       INTRO
       ========================= */

    .header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0;

      font-family:
        "Times New Roman",
        Georgia,
        serif;

      font-size: 27px;
      line-height: 1.18;

      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .subtitle {
      max-width: 330px;

      margin: 12px auto 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.65;
    }

    /* =========================
       CUENTAS
       ========================= */

    .accounts {
      display: grid;
      gap: 13px;
    }

    .account-card {
      width: 100%;

      min-height: 94px;
      padding: 15px 16px;

      display: flex;
      align-items: center;
      gap: 15px;

      color: inherit;
      text-decoration: none;

      border: 1px solid var(--line);
      border-radius: 18px;

      background: var(--card);

      box-shadow: var(--shadow);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease,
        background-color 180ms ease;
    }

    .account-card:active {
      transform: scale(0.985);
      background: rgba(255, 255, 255, 0.92);
    }

    /* =========================
       AVATAR
       ========================= */

    .avatar {
      flex: 0 0 auto;

      width: 62px;
      height: 62px;

      display: grid;
      place-items: center;

      border: 1px solid var(--gold-soft);
      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #faf7f1,
          #eee6da
        );

      color: var(--gold);

      font-family:
        "Times New Roman",
        Georgia,
        serif;

      font-size: 27px;
      font-weight: 400;
    }

    /* =========================
       INFORMACIÓN CUENTA
       ========================= */

    .account-info {
      min-width: 0;
      flex: 1;
    }

    .account-name {
      margin: 0 0 6px;

      overflow: hidden;

      font-family:
        "Times New Roman",
        Georgia,
        serif;

      font-size: 20px;
      font-weight: 400;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-user {
      margin: 0;

      overflow: hidden;

      color: var(--muted);

      font-size: 13px;
      letter-spacing: 0.02em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       FLECHA
       ========================= */

    .arrow {
      flex: 0 0 auto;

      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(182, 138, 71, 0.22);
      border-radius: 50%;

      color: var(--gold);

      background: rgba(182, 138, 71, 0.05);
    }

    .arrow svg {
      width: 18px;
      height: 18px;

      fill: none;
      stroke: currentColor;

      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       ORNAMENTO
       ========================= */

    .ornament {
      width: 120px;

      margin: 28px auto 18px;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ornament::before,
    .ornament::after {
      content: "";

      flex: 1;
      height: 1px;

      background: var(--gold-soft);
    }

    .ornament-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--gold);
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      text-align: center;

      color: #999187;

      font-size: 10px;
      font-weight: 500;

      letter-spacing: 0.18em;
    }

    /* =========================
       DESKTOP / HOVER
       ========================= */

    @media (min-width: 700px) {
      .account-card:hover {
        transform: translateY(-3px);

        border-color:
          rgba(182, 138, 71, 0.32);

        box-shadow:
          0 22px 60px
          rgba(70, 60, 47, 0.12);

        background:
          rgba(255, 255, 255, 0.92);
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <!-- =========================
         LOGO OFICIAL
         ========================= -->

    <section class="brand">

      <img
        class="brand-logo"
        src="sophlux-logo.png"
        alt="SOPHLUX Colección Hogar"
      >

    </section>


    <!-- =========================
         INTRO
         ========================= -->

    <header class="header">

      <h1>
        Elige dónde quieres encontrarnos
      </h1>

      <p class="subtitle">
        SOPHLUX nace de la unión de dos marcas.
        Selecciona una para conocer su colección
        y seguirnos en Instagram.
      </p>

    </header>


    <!-- =========================
         CUENTAS INSTAGRAM
         ========================= -->

    <section class="accounts">


      <!-- SOPHHAUS -->

      <a
        class="account-card"
        href="https://www.instagram.com/sophhaus.cl/"
        onclick="openInstagram('sophhaus.cl'); return false;"
        aria-label="Abrir SophHaus en Instagram"
      >

        <div class="avatar">
          S
        </div>

        <div class="account-info">

          <p class="account-name">
            SophHaus
          </p>

          <p class="account-user">
            @sophhaus.cl
          </p>

        </div>

        <div
          class="arrow"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>

        </div>

      </a>


      <!-- LUX & FORM -->

      <a
        class="account-card"
        href="https://www.instagram.com/luxandform.cl/"
        onclick="openInstagram('luxandform.cl'); return false;"
        aria-label="Abrir Lux and Form en Instagram"
      >

        <div class="avatar">
          L
        </div>

        <div class="account-info">

          <p class="account-name">
            Lux &amp; Form
          </p>

          <p class="account-user">
            @luxandform.cl
          </p>

        </div>

        <div
          class="arrow"
          aria-hidden="true"
        >

          <svg viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>

        </div>

      </a>

    </section>


    <!-- =========================
         DETALLE DORADO
         ========================= -->

    <div
      class="ornament"
      aria-hidden="true"
    >
      <span class="ornament-dot"></span>
    </div>


    <footer class="footer">
      SOPHLUX · COLECCIÓN HOGAR
    </footer>

  </main>


  <!-- =========================
       INSTAGRAM
       ========================= -->

  <script>

    function openInstagram(username) {

      const cleanUsername =
        username
          .replace("@", "")
          .trim();

      const appUrl =
        "instagram://user?username=" +
        encodeURIComponent(cleanUsername);

      const webUrl =
        "https://www.instagram.com/" +
        encodeURIComponent(cleanUsername) +
        "/";

      let fallbackTimer;

      /*
       * Intentamos abrir Instagram.
       */

      window.location.href = appUrl;


      /*
       * Si la aplicación se abre,
       * la página pasa a segundo plano.
       * En ese caso cancelamos el fallback.
       */

      const visibilityHandler = () => {

        if (document.hidden) {
          clearTimeout(fallbackTimer);
        }

      };

      document.addEventListener(
        "visibilitychange",
        visibilityHandler,
        { once: true }
      );


      /*
       * Si Instagram no se abrió,
       * después de 1.3 segundos
       * enviamos al usuario a Instagram Web.
       */

      fallbackTimer =
        setTimeout(() => {

          if (!document.hidden) {
            window.location.href = webUrl;
          }

        }, 1300);

    }

  </script>

</body>
</html>
