<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
 
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
 
  <meta name="theme-color" content="#11101a" />
 
  <title>Elige una cuenta de Instagram</title>
 
  <style>
    :root {
      --background: #0d0c14;
      --card: rgba(255, 255, 255, 0.09);
      --card-border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.68);
    }
 
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
 
    html,
    body {
      min-height: 100%;
      margin: 0;
    }
 
    body {
      min-height: 100dvh;
      padding:
        max(24px, env(safe-area-inset-top))
        20px
        max(24px, env(safe-area-inset-bottom));
 
      display: flex;
      align-items: center;
      justify-content: center;
 
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
 
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255, 48, 108, 0.32),
          transparent 38%
        ),
        radial-gradient(
          circle at 90% 25%,
          rgba(131, 58, 180, 0.38),
          transparent 38%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(252, 175, 69, 0.2),
          transparent 44%
        ),
        var(--background);
    }
 
    .page {
      width: 100%;
      max-width: 440px;
    }
 
    .header {
      margin-bottom: 28px;
      text-align: center;
    }
 
    .instagram-logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
 
      display: grid;
      place-items: center;
 
      border-radius: 22px;
 
      background:
        linear-gradient(
          135deg,
          #833ab4,
          #fd1d1d,
          #fcb045
        );
 
      box-shadow:
        0 18px 45px rgba(193, 53, 132, 0.32);
    }
 
    .instagram-logo svg {
      width: 37px;
      height: 37px;
      fill: none;
      stroke: white;
      stroke-width: 2;
    }
 
    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 38px);
      line-height: 1.05;
      letter-spacing: -1.2px;
    }
 
    .subtitle {
      max-width: 330px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
 
    .accounts {
      display: grid;
      gap: 14px;
    }
 
    .account-card {
      width: 100%;
      min-height: 104px;
      padding: 16px;
 
      display: flex;
      align-items: center;
      gap: 15px;
 
      color: inherit;
      text-decoration: none;
 
      border: 1px solid var(--card-border);
      border-radius: 24px;
 
      background: var(--card);
      box-shadow:
        0 16px 42px rgba(0, 0, 0, 0.22);
 
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
 
      transition:
        transform 160ms ease,
        background-color 160ms ease,
        border-color 160ms ease;
    }
 
    .account-card:active {
      transform: scale(0.975);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
    }
 
    .avatar-ring {
      flex: 0 0 auto;
      width: 70px;
      height: 70px;
      padding: 3px;
 
      border-radius: 50%;
 
      background:
        linear-gradient(
          135deg,
          #833ab4,
          #fd1d1d,
          #fcb045
        );
    }
 
    .avatar {
      width: 100%;
      height: 100%;
 
      display: grid;
      place-items: center;
 
      border: 3px solid #15131e;
      border-radius: 50%;
 
      color: white;
      font-size: 24px;
      font-weight: 800;
 
      background:
        linear-gradient(
          145deg,
          #2d2939,
          #16141f
        );
    }
 
    .account-info {
      min-width: 0;
      flex: 1;
    }
 
    .account-name {
      margin: 0 0 5px;
      overflow: hidden;
 
      font-size: 18px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
 
    .account-user {
      margin: 0;
      overflow: hidden;
 
      color: var(--muted);
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
 
    .arrow {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
 
      display: grid;
      place-items: center;
 
      border-radius: 14px;
 
      background: rgba(255, 255, 255, 0.1);
    }
 
    .arrow svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
 
    .footer {
      margin-top: 24px;
      text-align: center;
      color: rgba(255, 255, 255, 0.42);
      font-size: 12px;
    }
 
    @media (min-width: 700px) {
      .account-card:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.13);
        border-color: rgba(255, 255, 255, 0.25);
      }
    }
</style>
</head>
 
<body>
<main class="page">
<header class="header">
<div class="instagram-logo" aria-hidden="true">
<svg viewBox="0 0 24 24">
<rect x="3" y="3" width="18" height="18" rx="5"></rect>
<circle cx="12" cy="12" r="4"></circle>
<circle cx="17.5" cy="6.5" r="1"></circle>
</svg>
</div>
 
      <h1>¿A qué cuenta quieres ir?</h1>
 
      <p class="subtitle">
        Selecciona una opción para abrir su perfil oficial en Instagram.
</p>
</header>
 
    <section class="accounts">
<a
        class="account-card"
        href="#"
        onclick="openInstagram('CUENTA_INSTAGRAM_1'); return false;"
        aria-label="Abrir primera cuenta de Instagram"
>
<div class="avatar-ring">
<div class="avatar">A</div>
</div>
 
        <div class="account-info">
<p class="account-name">Nombre cuenta 1</p>
<p class="account-user">@CUENTA_INSTAGRAM_1</p>
</div>
 
        <div class="arrow" aria-hidden="true">
<svg viewBox="0 0 24 24">
<path d="M5 12h14"></path>
<path d="m13 6 6 6-6 6"></path>
</svg>
</div>
</a>
 
      <a
        class="account-card"
        href="#"
        onclick="openInstagram('CUENTA_INSTAGRAM_2'); return false;"
        aria-label="Abrir segunda cuenta de Instagram"
>
<div class="avatar-ring">
<div class="avatar">B</div>
</div>
 
        <div class="account-info">
<p class="account-name">Nombre cuenta 2</p>
<p class="account-user">@CUENTA_INSTAGRAM_2</p>
</div>
 
        <div class="arrow" aria-hidden="true">
<svg viewBox="0 0 24 24">
<path d="M5 12h14"></path>
<path d="m13 6 6 6-6 6"></path>
</svg>
</div>
</a>
</section>
 
    <footer class="footer">
      Serás redirigido al perfil seleccionado.
</footer>
</main>
 
  <script>
    function openInstagram(username) {
      const cleanUsername = username.replace("@", "").trim();
 
      const appUrl =
        "instagram://user?username=" +
        encodeURIComponent(cleanUsername);
 
      const webUrl =
        "https://www.instagram.com/" +
        encodeURIComponent(cleanUsername) +
        "/";
 
      const startTime = Date.now();
 
      window.location.href = appUrl;
 
      setTimeout(() => {
        const appDidNotOpen = Date.now() - startTime < 1800;
 
        if (appDidNotOpen && !document.hidden) {
          window.location.href = webUrl;
        }
      }, 1200);
    }
</script>
</body>
</html>
