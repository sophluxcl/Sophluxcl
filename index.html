<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#f5f0e8" />

  <title>SOPHLUX · Colección Hogar</title>

  <style>
    :root {
      --background: #f5f0e8;
      --background-soft: #fbf8f2;
      --card: rgba(255, 255, 255, 0.72);

      --text: #272624;
      --muted: #777169;

      --gold: #b58a49;
      --gold-soft: #d8c19a;

      --line: rgba(64, 58, 50, 0.12);

      --shadow:
        0 18px 50px rgba(71, 61, 48, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;

      padding:
        max(28px, env(safe-area-inset-top))
        22px
        max(28px, env(safe-area-inset-bottom));

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--text);

      font-family:
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255,255,255,.9),
          transparent 45%
        ),
        linear-gradient(
          180deg,
          #fbf8f3 0%,
          #f4eee5 100%
        );
    }

    .page {
      width: 100%;
      max-width: 430px;
    }

    /* =========================
       LOGO SOPHLUX
       ========================= */

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .isotipo {
      width: 78px;
      height: 78px;
      margin: 0 auto 12px;

      display: grid;
      place-items: center;
    }

    .isotipo svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .brand-name {
      margin: 0;

      font-family:
        "Times New Roman",
        Georgia,
        serif;

      font-size: clamp(44px, 13vw, 58px);
      font-weight: 400;

      letter-spacing: 0.17em;
      line-height: 0.95;

      transform: translateX(0.08em);
    }

    .brand-line {
      width: 52px;
      height: 1px;

      margin: 17px auto 13px;

      background: var(--gold);
    }

    .brand-subtitle {
      margin: 0;

      font-size: 12px;
      font-weight: 500;

      letter-spacing: 0.34em;
      text-transform: uppercase;

      color: #37332e;

      transform: translateX(0.17em);
    }

    /* =========================
       INTRO
       ========================= */

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;

      font-family:
        "Times New Roman",
        Georgia,
        serif;

      font-size: 27px;
      line-height: 1.15;

      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .subtitle {
      max-width: 325px;

      margin: 11px auto 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.65;
    }

    /* =========================
       CUENTAS
       ========================= */

    .accounts {
      display: grid;
      gap: 13px;
    }

    .account-card {
      width: 100%;

      min-height: 94px;
      padding: 15px 16px;

      display: flex;
      align-items: center;
      gap: 15px;

      color: inherit;
      text-decoration: none;

      border: 1px solid var(--line);
      border-radius: 18px;

      background: var(--card);

      box-shadow: var(--shadow);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease,
        background-color 180ms ease;
    }

    .account-card:active {
      transform: scale(0.985);
      background: rgba(255,255,255,.9);
    }

    .avatar {
      flex: 0 0 auto;

      width: 62px;
      height: 62px;

      display: grid;
      place-items: center;

      border: 1px solid var(--gold-soft);
      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #faf7f1,
          #eee6da
        );

      color: var(--gold);

      font-family:
        "Times New Roman",
        Georgia,
        serif;

      font-size: 27px;
      font-weight: 400;
    }

    .account-info {
      min-width: 0;
      flex: 1;
    }

    .account-name {
      margin: 0 0 6px;

      overflow: hidden;

      font-family:
        "Times New Roman",
        Georgia,
        serif;

      font-size: 20px;
      font-weight: 400;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .account-user {
      margin: 0;

      overflow: hidden;

      color: var(--muted);

      font-size: 13px;
      letter-spacing: 0.02em;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      flex: 0 0 auto;

      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(181,138,73,.22);
      border-radius: 50%;

      color: var(--gold);

      background: rgba(181,138,73,.05);
    }

    .arrow svg {
      width: 18px;
      height: 18px;

      fill: none;
      stroke: currentColor;

      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       DETALLE DECORATIVO
       ========================= */

    .ornament {
      width: 120px;

      margin: 28px auto 18px;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ornament::before,
    .ornament::after {
      content: "";

      flex: 1;
      height: 1px;

      background: var(--gold-soft);
    }

    .ornament-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;
      background: var(--gold);
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      text-align: center;

      color: #9a9388;

      font-size: 11px;
      letter-spacing: 0.08em;
    }

    @media (min-width: 700px) {
      .account-card:hover {
        transform: translateY(-3px);

        border-color: rgba(181,138,73,.32);

        box-shadow:
          0 22px 60px rgba(71, 61, 48, 0.12);

        background: rgba(255,255,255,.9);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- =========================
         IDENTIDAD SOPHLUX
         ========================= -->

    <section class="brand">

      <div class="isotipo" aria-hidden="true">

        <!--
          Isotipo visual inspirado en SOPHLUX.
          Si tienes el SVG oficial, reemplaza este SVG
          por el archivo definitivo.
        -->

        <svg viewBox="0 0 100 100">

          <!-- Casa -->
          <path
            d="M18 62 V35 L50 10 L82 35 V62"
            fill="none"
            stroke="#2d2c29"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <!-- Llama -->
          <path
            d="
              M50 24
              C45 34 42 42 44 50
              C46 57 53 59 50 70
              C59 63 63 55 60 48
              C58 43 54 41 55 34
              C53 38 51 42 50 47
              C47 42 48 34 50 24
            "
            fill="#b58a49"
          />

        </svg>

      </div>

      <h2 class="brand-name">
        SOPHLUX
      </h2>

      <div class="brand-line"></div>

      <p class="brand-subtitle">
        Colección Hogar
      </p>

    </section>


    <!-- =========================
         TEXTO
         ========================= -->

    <header class="header">

      <h1>
        Elige dónde quieres encontrarnos
      </h1>

      <p class="subtitle">
        SOPHLUX nace de la unión de dos marcas.
        Selecciona una para conocer su colección
        y seguirnos en Instagram.
      </p>

    </header>


    <!-- =========================
         CUENTAS
         ========================= -->

    <section class="accounts">

      <!-- SOPHHAUS -->

      <a
        class="account-card"
        href="https://www.instagram.com/sophhaus.cl/"
        onclick="openInstagram('sophhaus.cl'); return false;"
        aria-label="Abrir SophHaus en Instagram"
      >

        <div class="avatar">
          S
        </div>

        <div class="account-info">

          <p class="account-name">
            SophHaus
          </p>

          <p class="account-user">
            @sophhaus.cl
          </p>

        </div>

        <div class="arrow" aria-hidden="true">

          <svg viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>

        </div>

      </a>


      <!-- LUX & FORM -->

      <a
        class="account-card"
        href="https://www.instagram.com/luxandform.cl/"
        onclick="openInstagram('luxandform.cl'); return false;"
        aria-label="Abrir Lux and Form en Instagram"
      >

        <div class="avatar">
          L
        </div>

        <div class="account-info">

          <p class="account-name">
            Lux &amp; Form
          </p>

          <p class="account-user">
            @luxandform.cl
          </p>

        </div>

        <div class="arrow" aria-hidden="true">

          <svg viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>

        </div>

      </a>

    </section>


    <!-- DECORACIÓN -->

    <div class="ornament" aria-hidden="true">
      <span class="ornament-dot"></span>
    </div>


    <footer class="footer">
      SOPHLUX · COLECCIÓN HOGAR
    </footer>

  </main>


  <script>
    function openInstagram(username) {

      const cleanUsername =
        username
          .replace("@", "")
          .trim();

      /*
        Intenta abrir la aplicación de Instagram.
      */

      const appUrl =
        "instagram://user?username=" +
        encodeURIComponent(cleanUsername);

      /*
        Si Instagram no está instalado,
        abre automáticamente la versión web.
      */

      const webUrl =
        "https://www.instagram.com/" +
        encodeURIComponent(cleanUsername) +
        "/";

      let fallbackTimer;

      const openWeb = () => {
        if (!document.hidden) {
          window.location.href = webUrl;
        }
      };

      document.addEventListener(
        "visibilitychange",
        () => {

          if (document.hidden) {
            clearTimeout(fallbackTimer);
          }

        },
        { once: true }
      );

      window.location.href = appUrl;

      fallbackTimer =
        setTimeout(
          openWeb,
          1300
        );
    }
  </script>

</body>
</html>
